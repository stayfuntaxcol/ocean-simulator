<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microleven · Ocean Simulator</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10252b;color:#e5f7f7;font:15px system-ui}header,footer{padding:18px;max-width:1100px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5;color:#b3cccc}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}button,select,a{padding:9px;border:1px solid #668991;border-radius:8px;color:#e8fbff;background:#234953;text-decoration:none}input{width:100px}main{height:64vh;min-height:340px;max-width:1100px;margin:auto}canvas{width:100%;height:100%;display:block}footer{font-size:13px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script></head>
<body><header><h1>Het kleine leven op het rif</h1><p>Bekijk dezelfde modellen als in de oceaan van dichtbij. In de simulator zijn het kleine dieren tussen koraal, gras en rotsen.</p>
<nav><label>Dier <select id="species"><option value="shrimp">Garnaal</option><option value="starfish">Zeester</option><option value="urchin">Zee-egel</option><option value="shell">Schelp</option><option value="crab">Krab</option><option value="minnow">Verre schoolvis</option></select></label>
<button id="pause" aria-pressed="false">Pauzeren</button><label>Draai <input id="angle" type="range" min="-180" max="180" value="20"></label><label>Detail <select id="quality"><option value="high">Hoog</option><option value="low">Licht</option></select></label><a href="../?scene=reference">Open de oceaan</a></nav></header>
<main id="stage"></main><footer id="status">Modellen laden…</footer>
<script type="module">
import * as THREE from 'three';
import {createMicroGeometry,MICRO_TYPES} from './MicroLifeGeometry.js';
import {createMicroMaterial} from './MicroLife.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
try{
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x173a43);
  const camera=new THREE.PerspectiveCamera(38,1,.01,60);camera.position.set(.9,1.15,1.65);camera.lookAt(0,.15,0);
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;stage.append(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xd4f2ff,0x655b44,2));const key=new THREE.DirectionalLight(0xffedcd,3);key.position.set(2,4,3);scene.add(key);const rim=new THREE.DirectionalLight(0x94d9ed,1.5);rim.position.set(-3,2,-4);scene.add(rim);
  const ground=new THREE.Mesh(new THREE.CircleGeometry(2,48),new THREE.MeshStandardMaterial({color:0x958060,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.005;scene.add(ground);
  const clock={value:0},light={oceanTime:clock,oceanStrength:{value:.16}},models=new Map();
  for(const type of [...MICRO_TYPES,'minnow']){const near=createMicroGeometry(type),far=createMicroGeometry(type,true),material=createMicroMaterial(type,clock,light,false),mesh=new THREE.Mesh(near,material);mesh.visible=false;scene.add(mesh);models.set(type,{near,far,material,mesh});}
  const species=document.getElementById('species'),quality=document.getElementById('quality'),angle=document.getElementById('angle');
  let paused=false,last=performance.now(),stopped=false,frameId=0;
  document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Verder':'Pauzeren';e.target.setAttribute('aria-pressed',String(paused));};
  function resize(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight);}addEventListener('resize',resize);resize();
  function frame(now){if(stopped)return;const dt=paused?0:Math.min(.05,(now-last)/1000);last=now;clock.value+=dt;
    for(const [type,m] of models){m.mesh.visible=type===species.value;m.mesh.geometry=quality.value==='low'?m.far:m.near;m.mesh.rotation.y=Number(angle.value)*Math.PI/180;m.mesh.position.y=type==='minnow'?.2:0;}
    renderer.render(scene,camera);frameId=requestAnimationFrame(frame);
  }frameId=requestAnimationFrame(frame);
  status.textContent='In de oceaan vind je deze bodemdieren rond het rif. Garnalen en krabben maken kleine bewegingen. Verre schooltjes en planktonlagen kun je daar apart aan- en uitzetten.';
  addEventListener('pagehide',()=>{stopped=true;cancelAnimationFrame(frameId);removeEventListener('resize',resize);models.forEach(m=>{m.near.dispose();m.far.dispose();m.material.dispose();});ground.geometry.dispose();ground.material.dispose();renderer.dispose();},{once:true});
}catch(error){status.textContent='Weergave kon niet starten: '+error.message;console.error(error);}
</script></body></html>
