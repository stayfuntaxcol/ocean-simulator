name: Visual foundation checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'graphics/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/visual-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
