<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animal Design Studio · Ocean Simulator</title><link rel="stylesheet" href="studio.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script></head><body>
<header><a href="../index.html">← Oceaan</a><div><h1>Animal Design Studio</h1><p>Vorm, beweging en gedrag · dezelfde modellen als in je oceaan</p></div><button id="apply">Toepassen in mijn oceaan</button></header>
<main><aside><nav id="species" aria-label="Diersoort"></nav><div class="preset"><label>Begin met <select id="preset"><option value="default">Eigen ontwerp</option><option value="cinematic">Cinematisch</option><option value="family">Moeder en jong</option></select></label><button id="reset">Herstel deze soort</button></div><div id="controls"></div></aside><section class="preview"><div id="viewport"></div><div class="viewtools"><button id="pause">Pauze</button><button id="restart">Herstart proef</button><button id="camera">Bekijk model</button><button id="follow">Volg dier</button><button id="isolate" aria-pressed="false">Alleen dit model</button><label>Proef <select id="scenario"><option value="model">Model en vrij zwemmen</option><option value="food">Moeder, jong en voedsel</option><option value="migration">Migratie A → B</option><option value="age">Schildpad op leeftijd</option></select></label><label id="ageLabel" hidden>Leeftijd <input id="testAge" type="range" min="0" max="120" value="0"><output id="ageValue">0 jaar</output></label><button id="feed">Laat dode vis vallen</button><button id="hungry">Maak orka’s hongerig</button></div><div id="telemetry" aria-live="polite"></div><p id="scenarioInfo"></p></section></main>
<footer><button id="export">Exporteer instellingen</button><label class="filebutton">Importeer instellingen<input id="import" type="file" accept=".json,application/json"></label><span id="status" role="status">Draai met de muis · zoom met het wiel · alle waarden blijven bewerkbaar</span></footer><script type="module" src="studio.js"></script></body></html>
